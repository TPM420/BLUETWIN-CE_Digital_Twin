# config/indicators.yaml
#
# Definicija 42 aktivnih indikatorjev BLUETWIN-CE modela.
# Vir: Priloga A dokumenta
#   "NOVA_BLUETWIN-CE_Navodila_za_razvoj_Digital_Twin_aplikacije_Svidnik.docx"
# Ta datoteka je rekonstruirana iz Priloge A (tabela je tam eksplicitno
# označena kot "povzeta iz aktivnih indicators.yaml in layers.yaml").
# Nobena vrednost (weight, direction, min/max) ni izmišljena ali spremenjena
# glede na dokument - gre za dobeseden prepis v strojno berljivo obliko.
#
# Polja:
#   id        - identifikator indikatorja (uporabljen v raw_values in pilot YAML)
#   name      - ime indikatorja (EN, kot v dokumentu)
#   layer     - podatkovni sloj L1-L7, kateremu indikator pripada
#   direction - "positive": višja normalizirana vrednost = boljše stanje
#               "negative": višja normalizirana vrednost = slabše stanje
#               (normalization.py mora smer obrniti pri "negative")
#   weight    - utež indikatorja znotraj svojega sloja (layer_scoring.py)
#   min_value / max_value - meje za min-max normalizacijo na 0-1

